name: E2E

on:
  pull_request:
    branches:
      - OSC-MIGRATION
      - main
    paths:
      - "**.go"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - "helm/osc-bsu-csi-driver/**.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sanity:
    runs-on: [self-hosted, linux, local]
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 🧹 Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-osc-bsu-csi-driver
        exclude_resource_types: access_key
    - name: 🧪 Sanity test
      run:
        make test-sanity
      env:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
  e2e:
    runs-on: [self-hosted, linux, kube]
    needs: [sanity]
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.34.9
    - name: ⬇️ Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: ⬇️ Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: 🧹 Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-osc-bsu-csi-driver
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 👷 Deploy test cluster
      id: caposc
      uses: outscale/.github/kube-setup@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      timeout-minutes: 40
      with:
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ vars.IMG_MANAGEMENT }}
        CCM: true
        ALLOW_FROM: ${{ vars.ALLOW_FROM }}
        vault_role: outscale-osc-bsu-csi-driver
        vault_token: ${{ steps.secrets.outputs.vault_token }}
    - name: 🐳 Login to Harbor
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: 📦 Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 📦 Push the Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/osc-bsu-csi-driver"
        IMAGE_TAG: "${{ github.sha }}-amd64"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/csi"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 👷 Install CSI
      run: |
        octl kube secret --name osc-csi-bsu | kubectl apply -f -
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
        make helm_deploy
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/csi"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 🧪 Run e2e tests
      run: make test-e2e
      timeout-minutes: 120
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 🧹 Teardown test cluster
      if: ${{ always() }}
      uses: outscale/.github/kube-teardown@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
