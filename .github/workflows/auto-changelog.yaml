name: 📝 Changelog

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📝 Changelog
        uses: outscale/.github/post-release@95a82755abf72a78ac11b119da11d042e0152328 # v1.2.0
        with:
          changelog: CHANGELOG-1.X.md
