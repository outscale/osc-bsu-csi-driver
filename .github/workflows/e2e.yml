name: E2E

on:
  pull_request:
    branches:
      - OSC-MIGRATION
      - main
    paths:
      - "**.go"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - "helm/osc-bsu-csi-driver/**.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    runs-on: [self-hosted, linux, kube]
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        version: v1.34.9
    - name: ⬇️ Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: ⬇️ Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: 🧹 Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@3473e386226175ad703740601d34849b9b61364f # v1.4.0
      with:
        vault_role: outscale-osc-bsu-csi-driver
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 👷 Deploy test cluster
      id: caposc
      uses: outscale/.github/deploy-cluster@fix_kubeconfig
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ vars.IMG_MANAGEMENT }}
        CCM: true
        KUSTOMIZE_PATH: "tests/e2e/capi-kustomize"
        vault_token: ${{ steps.secrets.outputs.vault_token }}
    - name: 🐳 Login to Harbor
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: 📦 Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 📦 Push the Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/osc-bsu-csi-driver"
        IMAGE_TAG: "${{ github.sha }}-amd64"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/csi"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 👷 Install CSI
      run: |
        kubectl create secret generic osc-csi-bsu --from-literal=access_key=$OSC_ACCESS_KEY --from-literal=secret_key=$OSC_SECRET_KEY -n kube-system
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.6/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
        make helm_deploy
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.caposc.outputs.KUBECONFIG }}"
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/csi"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 🧪 Run e2e tests
      run: make test-e2e
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.caposc.outputs.KUBECONFIG }}"
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        AWS_AVAILABILITY_ZONES: ${{ env.OSC_SUBREGION_NAME }}
