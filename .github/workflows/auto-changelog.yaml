name: 📝 Changelog

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📝 Changelog
        uses: outscale/.github/post-release@3473e386226175ad703740601d34849b9b61364f # v1.4.0
        with:
          changelog: CHANGELOG-1.X.md
